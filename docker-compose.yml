services:
  mysql:
    image: mysql:8.0
    container_name: conciliacion_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo se ejecuta en el primer arranque (volumen vacío).
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - conciliacion_net

  redis:
    image: redis:7-alpine
    container_name: conciliacion_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conciliacion_net

  # DEV ONLY — quitar este servicio o restringir la ruta /phpmyadmin/ por
  # IP en nginx antes de desplegar a producción/staging.
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: conciliacion_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      # Necesario para que assets/redirects funcionen bajo el subpath público.
      PMA_ABSOLUTE_URI: ${APP_URL}/phpmyadmin/
    networks:
      - conciliacion_net
    # No se publica ports: — solo alcanzable dentro de la red interna;
    # el acceso externo es exclusivamente vía nginx.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conciliacion_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      # Bind-mount real al host (no volumen Docker anonimo) para que los
      # adjuntos descargados sean visibles/editables desde el explorador de
      # Windows, tal como lo pidio el usuario. La ruta configurable del
      # frontend (tab Buzon -> ruta_descargas) es una subcarpeta RELATIVA a
      # esta base, nunca una ruta arbitraria del host.
      - C:/Documentos/DescargasFacturas:/app/descargas-facturas
    networks:
      - conciliacion_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conciliacion_worker
    restart: unless-stopped
    command: ["node", "src/workers/index.js"]
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - C:/Documentos/DescargasFacturas:/app/descargas-facturas
    networks:
      - conciliacion_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conciliacion_frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend
    networks:
      - conciliacion_net

  nginx:
    image: nginx:1.27-alpine
    container_name: conciliacion_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - phpmyadmin
    networks:
      - conciliacion_net

networks:
  conciliacion_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
