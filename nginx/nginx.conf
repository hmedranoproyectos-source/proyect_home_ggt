user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    # DNS embebido de Docker Compose. Sin esto, los nombres de servicio
    # (backend/frontend/phpmyadmin) solo se resuelven una vez al arrancar
    # el proceso maestro de nginx: si en ese instante el contenedor destino
    # todavía no tiene una entrada DNS (p.ej. está reiniciándose), nginx
    # falla con "host not found in upstream" y no arranca — ni siquiera
    # para rutas que no dependen de ese servicio. Con `resolver` + variables
    # en proxy_pass, la resolución se hace en cada request, no al boot.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # API backend (Express) — se conserva el prefijo /api/ tal como lo
        # espera el router del backend.
        location /api/ {
            set $backend_upstream http://backend:3001;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # DEV ONLY — remove or IP-restrict in production
        location /phpmyadmin/ {
            # proxy_pass con variable ya no hace el strip automático del
            # prefijo de location (solo ocurre con host fijo); por eso se
            # reescribe la URI explícitamente antes de proxear — phpMyAdmin
            # vive en la raíz de su propio docroot, no en /phpmyadmin/.
            # IMPORTANTE: el `set` debe ir ANTES del `rewrite ... break;` —
            # `break` detiene el procesamiento del módulo rewrite (del que
            # `set` también forma parte), así que un `set` posterior nunca
            # se ejecutaría y la variable quedaría vacía.
            set $phpmyadmin_upstream http://phpmyadmin:80;
            rewrite ^/phpmyadmin/(.*)$ /$1 break;
            proxy_pass $phpmyadmin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Frontend (Next.js) — incluye headers de upgrade para HMR/websockets.
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
